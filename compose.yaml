services:
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: expense-tracker-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10

  create-bucket:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: expense-tracker-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing minio/expense-tracker;
      exit 0;
      "

volumes:
  minio-data:
